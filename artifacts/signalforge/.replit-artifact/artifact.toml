kind = "web"
previewPath = "/"
title = "SignalForge"
description = "A premium trading intelligence workspace for monitoring signal flow, validating opportunities, managing risk, and preparing secure broker automation."
version = "1.0.0"
id = "artifacts/signalforge"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18852

[services.development]
run = "pnpm --filter @workspace/signalforge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/signalforge", "run", "build" ]
serve = "static"
publicDir = "artifacts/signalforge/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18852"
BASE_PATH = "/"
